repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Use the version of Ruff that matches your local environment
    rev: v0.17.2
    hooks:
      # Run the linter (and automatically fix safe issues/sort imports)
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format
