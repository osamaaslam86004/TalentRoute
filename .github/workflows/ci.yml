name: CI
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  observability-privacy-canary:
    name: Observability Privacy Canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run observability privacy canary tests
        run: pytest -v tests/unit/observability/test_telemetry_privacy.py

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - name: Run observability privacy canary tests
        run: pytest -v tests/unit/observability/test_telemetry_privacy.py
      - name: Run full test suite
        run: pytest -q
