[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-candidate-screening-service"
version = "1.2.0"
description = "An async FastAPI candidate-screening decision-support service using LangGraph, PostgreSQL, Redis, and Celery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "SQLAlchemy>=2.0.35,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<7.0",
  "celery[redis]>=5.4,<6.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.2,<2.0",
  "langgraph>=0.2,<2.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  # Observability. The contrib instrumentation packages are released in lockstep with the SDK and
  # pin each other, so keep them on one minor series and upgrade them together.
  "opentelemetry-sdk>=1.45,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<0.67",
  "opentelemetry-instrumentation-redis>=0.66b0,<0.67",
  "opentelemetry-instrumentation-celery>=0.66b0,<0.67",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
