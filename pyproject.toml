[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-candidate-screening-service"
version = "1.2.0"
description = "An async FastAPI candidate-screening decision-support service using LangGraph, PostgreSQL, Redis, and Celery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.143,<1.0",
  "starlette>=1.7.0,1.8"
  "pydantic>=2.14.1,<3.0",
  "pydantic-settings>=2.15.0,<3.0",
  "SQLAlchemy>=2.1.4,<3.0",
  "asyncpg>=0.32.0,<1.0",
  "alembic>=1.20.0,<2.0",
  "redis>=8.1.0,<9.0",
  "celery[redis]>=5.6.3,<6.0",
  "langchain-core>=1.6.9,<2.0",
  "langchain-openai>=1.7.0,<2.0",
  "langgraph>=1.2.14,<2.0",
  "openai>=3.29.0,<4.0",
  "httpx>=0.28.1,<1.0",
  "PyJWT[crypto]>=2.15.1,<3.0",
  "python-dotenv>=1.2.4,<2.0",
  # Observability. The contrib instrumentation packages are released in lockstep with the SDK and
  # pin each other, so keep them on one minor series and upgrade them together.
  "opentelemetry-sdk>=1.45.0,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b0,<0.67",
  "opentelemetry-instrumentation-redis>=0.66b0,<0.67",
  "opentelemetry-instrumentation-celery>=0.66b0,<0.67",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "ruff>=0.17,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]